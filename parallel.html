<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>병렬 타임라인 | 지금 상황판</title>
<script>
// Apply the saved theme before the first paint. Default is dark; storage may be blocked.
(function () {
  try {
    var saved = localStorage.getItem('parallel-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) { /* keep the default theme */ }
})();
</script>
<link rel="stylesheet" href="parallel.css">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="page">

<header class="top">
  <div class="top-title">
    <p class="kicker">공개 자료 모니터링 허브 / 독립 탭</p>
    <h1 id="title">시장 병렬 타임라인</h1>
    <p class="sub" id="meta">자료를 불러오는 중입니다.</p>
  </div>
  <div class="toolbar">
    <select class="select" id="date-select" aria-label="날짜 선택" disabled><option>날짜 불러오는 중</option></select>
    <p class="pill" id="status" role="status" aria-live="polite" aria-atomic="true" data-state="loading">불러오는 중</p>
    <div class="tool-buttons">
      <button type="button" class="btn" id="theme-toggle" aria-pressed="false">밝은 화면</button>
      <button type="button" class="btn" id="png-light" disabled>PNG 저장</button>
      <button type="button" class="btn" id="png-dark" disabled>어두운 PNG</button>
    </div>
    <p class="tool-note" id="tool-note" role="status" aria-live="polite"></p>
  </div>
</header>

<nav class="page-tabs" aria-label="상황판 화면"><a href="./">기존 상황판</a><a href="parallel.html" aria-current="page">병렬 타임라인</a><a href="election-results.html">선거 결과</a></nav>

<main class="main" id="main" tabindex="-1">
  <noscript><p class="notice">이 화면은 자바스크립트가 켜져 있어야 표시됩니다.</p></noscript>
  <p class="notice" id="no-notes" hidden>이 날짜의 분석 노트가 없습니다.</p>

  <section class="card headline" id="headline-sec" aria-labelledby="h-headline" hidden>
    <h2 id="h-headline">한 줄</h2>
    <p class="headline-text" id="headline"></p>
  </section>

  <section class="card chart-card" aria-labelledby="h-chart">
    <h2 class="sr-only" id="h-chart">병렬 차트</h2>
    <figure class="chart-fig">
      <div class="chart-box" id="chart-box" tabindex="0" role="group" aria-label="병렬 차트: 시각별 값 보기" aria-describedby="chart-help">
        <div class="chart" id="chart"><p class="chart-empty">자료를 불러오는 중입니다.</p></div>
        <div class="tip" id="tip" aria-hidden="true" hidden></div>
      </div>
      <figcaption class="caption"><span id="chart-caption"></span><span class="hint" id="chart-help">차트 위에 올리거나 누르면 그 시각의 값이 나옵니다. 차트에 초점을 두고 ← → 키로 15분씩, Home·End 키로 처음과 끝으로 이동합니다.</span></figcaption>
    </figure>
    <p class="sr-only" id="chart-live" aria-live="polite"></p>
  </section>

  <div class="duo" id="duo" hidden>
    <section class="card" id="obs-sec" aria-labelledby="h-obs">
      <h2 id="h-obs">차트에서 바로 보이는 것</h2>
      <ul class="obs" id="obs"></ul>
    </section>
    <section class="card" id="table-sec" aria-labelledby="h-table">
      <div class="card-head">
        <h2 id="h-table">시간표</h2>
        <div class="seg" id="panel-seg" role="group" aria-label="시간표 패널"></div>
      </div>
      <p class="basis" id="table-basis"></p>
      <div class="table-wrap" id="table"></div>
    </section>
  </div>

  <section id="sections-sec" aria-labelledby="h-sections" hidden>
    <h2 class="sr-only" id="h-sections">세부와 읽기</h2>
    <div class="cards" id="sections"></div>
  </section>

  <section class="card" id="watch-sec" aria-labelledby="h-watch" hidden>
    <h2 id="h-watch">볼 것</h2>
    <ul class="watch" id="watch"></ul>
  </section>

  <section class="card" id="story-sec" aria-labelledby="h-story" hidden>
    <h2 id="h-story">스토리텔링</h2>
    <div class="story" id="story"></div>
  </section>

  <section class="verdict" id="verdict-sec" aria-labelledby="h-verdict" hidden>
    <h2 id="h-verdict">판정</h2>
    <p id="verdict"></p>
  </section>

  <section class="card" id="events-sec" aria-labelledby="h-events" hidden>
    <h2 id="h-events">사건 목록</h2>
    <ol class="events" id="events"></ol>
  </section>
</main>

<footer class="foot" id="foot"></footer>

</div>
<script src="parallel-core.js" defer></script>
<script src="parallel-chart.js" defer></script>
<script src="parallel-view.js" defer></script>
</body>
</html>
